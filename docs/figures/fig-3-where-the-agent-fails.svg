<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
<text x="40" y="48" font-size="28" font-weight="bold" fill="#1f2937" text-anchor="start">Where the agent alone fails</text>
<text x="40" y="76" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="start">Agent-alone rows the lead accepted (28 scored), and his reasons on the 9 he rejected. A comment can carry several reasons.</text>
<rect x="40" y="100" width="560" height="520" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="60" y="132" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="start">Accepted, by market</text>
<text x="186" y="170.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="end">USA</text>
<rect x="200" y="150" width="260" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="200" y="150" width="225.33333333333334" height="30" rx="5" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="474" y="170.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">13 of 15 (87%)</text>
<text x="186" y="214.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="end">Gulf</text>
<rect x="200" y="194" width="260" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="200" y="194" width="120.0" height="30" rx="5" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="474" y="214.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">6 of 13 (46%)</text>
<text x="60" y="268" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="start">Accepted, by difficulty</text>
<text x="186" y="306.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="end">Easy</text>
<rect x="200" y="286" width="260" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="200" y="286" width="260.0" height="30" rx="5" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="474" y="306.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">1 of 1</text>
<text x="186" y="350.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="end">Medium</text>
<rect x="200" y="330" width="260" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="200" y="330" width="260.0" height="30" rx="5" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="474" y="350.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">11 of 11 (100%)</text>
<text x="186" y="394.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="end">Hard</text>
<rect x="200" y="374" width="260" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="200" y="374" width="113.75" height="30" rx="5" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="474" y="394.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">7 of 16 (44%)</text>
<text x="60" y="440" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">Difficulty was set before the run: how much a company shows</text>
<text x="60" y="462" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">of itself on the public web. The SDR alone felt the same wall:</text>
<text x="60" y="484" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">17.9 minutes per accepted row in the USA, 36.8 in the Gulf.</text>
<text x="60" y="506" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start"></text>
<text x="60" y="528" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">With the agent&#x27;s draft, the pair in the Gulf was accepted</text>
<text x="60" y="550" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">4 of 7 as first scored at 12.5 minutes per accepted row.</text>
<rect x="640" y="100" width="520" height="520" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="660" y="132" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="start">The lead&#x27;s reasons on the 9 rejected rows</text>
<text x="886" y="180" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="end">A different company with a similar name</text>
<rect x="900" y="160" width="170" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="900" y="160" width="170.0" height="30" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="1084" y="180" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">4</text>
<text x="886" y="230" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="end">Not the right target (lab-grown, segment)</text>
<rect x="900" y="210" width="170" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="900" y="210" width="127.5" height="30" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="1084" y="230" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">3</text>
<text x="886" y="280" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="end">Too little information</text>
<rect x="900" y="260" width="170" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="900" y="260" width="127.5" height="30" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="1084" y="280" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">3</text>
<text x="886" y="330" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="end">Priority wrong or missing</text>
<rect x="900" y="310" width="170" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="900" y="310" width="85.0" height="30" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="1084" y="330" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">2</text>
<text x="886" y="380" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="end">Revenue missing</text>
<rect x="900" y="360" width="170" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="900" y="360" width="85.0" height="30" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="1084" y="380" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">2</text>
<text x="886" y="430" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="end">Contacts missing</text>
<rect x="900" y="410" width="170" height="30" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="900" y="410" width="85.0" height="30" rx="5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="1084" y="430" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">2</text>
<text x="660" y="476" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">Identity is the weak step: 4 of 9 rejections were</text>
<text x="660" y="496" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the wrong company under a similar name. Version 2</text>
<text x="660" y="516" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">added &quot;open the About and Contact pages&quot;, but the</text>
<text x="660" y="536" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">agent-alone arm stays on version 1 by design.</text>
<text x="660" y="556" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start"></text>
<text x="660" y="576" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">The dead-end flag fired on 0 of 37 runs. It was built</text>
<text x="660" y="596" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">for three rules; the humans&#x27; six dead ends were of</text>
<text x="660" y="616" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">another kind, mostly a company that could not be identified.</text>
</svg>